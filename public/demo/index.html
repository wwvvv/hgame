<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>午夜来信 · 非露骨技术样板</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#294b3b,#0e1914);color:#edf7ed;font:16px/1.9 Arial,sans-serif}main{width:min(85%,650px);padding:30px 0}small{color:#b8d29f;letter-spacing:2px}h1{font-size:36px}button{display:block;padding:13px 20px;margin:12px 0;border:1px solid #b7d790;background:transparent;color:inherit;border-radius:10px;width:100%;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#365336;outline:2px solid #b7d790}p{min-height:90px}</style></head><body><main><small>HGAME / TRUSTED SMOKE DEMO</small><h1>午夜来信</h1><p id="story" aria-live="polite">你在灯塔前收到一封迟来的信。它没有署名，只有一张通往海边的地图。接下来，你准备怎么做？</p><div id="choices"><button data-ending="letter">打开来信</button><button data-ending="lighthouse">前往灯塔</button></div><button id="restart" hidden>重新开始</button><small>仅验证分支与网页加载；无实时 AI、无收费、无存档。</small></main><script>const story=document.getElementById('story'),choices=document.getElementById('choices'),restart=document.getElementById('restart');const opening=story.textContent;choices.addEventListener('click',e=>{const key=e.target.dataset.ending;if(!key)return;story.textContent=key==='letter'?'结局 A · 重逢：信中留下了故友的地址。你决定在天亮时出发。':'结局 B · 守望：灯塔照亮海面。你把回信留在门边，等待下一次相遇。';choices.hidden=true;restart.hidden=false;});restart.addEventListener('click',()=>{story.textContent=opening;choices.hidden=false;restart.hidden=true;});</script></body></html>
